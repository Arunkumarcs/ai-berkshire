<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Berkshire — Consolidated Dashboard</title>
<style>
:root {
  --bg: #f5f7fa;
  --bg2: #ffffff;
  --sidebar: #1a1d2e;
  --sidebar-hover: #252839;
  --sidebar-active: #2d6a4f;
  --text: #1a1d2e;
  --text2: #6b7280;
  --border: #e5e7eb;
  --accent: #2d6a4f;
  --accent2: #40916c;
  --gain: #16a34a;
  --loss: #dc2626;
  --hold: #f59e0b;
  --card-shadow: 0 1px 3px rgba(0,0,0,.1);
  --modal-overlay: rgba(0,0,0,.5);
  --nav-width: 220px;
  --font: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --font-mono: 'SF Mono','Fira Code','Cascadia Code',monospace;
}
[data-theme=dark] {
  --bg: #0f1117;
  --bg2: #1a1d2e;
  --sidebar: #0b0d14;
  --sidebar-hover: #1a1d2e;
  --sidebar-active: #2d6a4f;
  --text: #e5e7eb;
  --text2: #9ca3af;
  --border: #2d3148;
  --card-shadow: 0 1px 3px rgba(0,0,0,.3);
  --modal-overlay: rgba(0,0,0,.7);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;min-height:100vh;overflow-x:hidden}
a{color:var(--accent2);text-decoration:none}
.sidebar{width:var(--nav-width);background:var(--sidebar);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;overflow-y:auto;transition:transform .2s}
.sidebar-brand{padding:16px 18px;font-size:15px;font-weight:700;color:#fff;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:8px}
.sidebar-brand span{color:var(--accent2)}
.nav-list{list-style:none;padding:8px 0}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 18px;color:rgba(255,255,255,.55);cursor:pointer;font-size:13px;font-weight:500;transition:all .15s;border-left:3px solid transparent}
.nav-item:hover{color:#fff;background:var(--sidebar-hover)}
.nav-item.active{color:#fff;background:var(--sidebar-active);border-left-color:var(--accent2);font-weight:600}
.nav-item .ico{width:18px;text-align:center;font-size:14px}
.main{flex:1;margin-left:var(--nav-width);min-height:100vh;display:flex;flex-direction:column}
.header{display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--border);background:var(--bg2);position:sticky;top:0;z-index:50;height:52px}
.header h1{font-size:16px;font-weight:600}
.header-actions{display:flex;align-items:center;gap:12px}
.theme-toggle{background:none;border:1px solid var(--border);border-radius:6px;padding:6px 10px;cursor:pointer;color:var(--text);font-size:13px;display:flex;align-items:center;gap:4px}
.theme-toggle:hover{background:var(--border)}
.content{padding:20px 24px;flex:1}
.tab{display:none}
.tab.active{display:block}
.tab-title{font-size:20px;font-weight:700;margin-bottom:4px}
.tab-desc{color:var(--text2);margin-bottom:16px;font-size:13px}
.stats-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:14px 18px;flex:1;min-width:140px;box-shadow:var(--card-shadow)}
.stat-card .label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);margin-bottom:4px}
.stat-card .value{font-size:20px;font-weight:700}
.stat-card .sub{font-size:11px;color:var(--text2);margin-top:2px}
.stat-card .value.gain{color:var(--gain)}
.stat-card .value.loss{color:var(--loss)}
table{width:100%;border-collapse:collapse;background:var(--bg2);border-radius:8px;overflow:hidden;box-shadow:var(--card-shadow);margin-bottom:16px}
th{text-align:left;padding:10px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);background:var(--bg);border-bottom:1px solid var(--border);font-weight:600}
td{padding:9px 12px;font-size:13px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(45,106,79,.04)}
td.num{font-family:var(--font-mono);text-align:right;font-size:12px}
td.num.gain{color:var(--gain)}
td.num.loss{color:var(--loss)}
td.center{text-align:center}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.badge-sb{background:#d1fae5;color:#065f46}
.badge-b{background:#dbeafe;color:#1e40af}
.badge-h{background:#fef3c7;color:#92400e}
.badge-s{background:#fee2e2;color:#991b1b}
[data-theme=dark] .badge-sb{background:#064e3b;color:#6ee7b7}
[data-theme=dark] .badge-b{background:#1e3a5f;color:#93c5fd}
[data-theme=dark] .badge-h{background:#78350f;color:#fcd34d}
[data-theme=dark] .badge-s{background:#7f1d1d;color:#fca5a5}
.badge-p1{background:#fee2e2;color:#991b1b}
.badge-p2{background:#fef3c7;color:#92400e}
.badge-p3{background:#e0e7ff;color:#3730a3}
[data-theme=dark] .badge-p1{background:#7f1d1d;color:#fca5a5}
[data-theme=dark] .badge-p2{background:#78350f;color:#fcd34d}
[data-theme=dark] .badge-p3{background:#312e81;color:#a5b4fc}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:var(--modal-overlay);z-index:999;justify-content:center;align-items:flex-start;padding:40px 20px;overflow-y:auto}
.modal-overlay.open{display:flex}
.modal{background:var(--bg2);border-radius:12px;max-width:900px;width:100%;padding:28px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.3);margin:auto}
.modal-close{position:absolute;top:14px;right:16px;background:none;border:none;font-size:22px;cursor:pointer;color:var(--text2);padding:4px 8px;border-radius:4px}
.modal-close:hover{background:var(--border);color:var(--text)}
.modal h2{font-size:20px;margin-bottom:4px}
.modal .ticker{color:var(--text2);font-size:13px;font-family:var(--font-mono)}
.modal .price-large{font-size:32px;font-weight:700;margin:8px 0}
.modal .price-change{font-size:14px;margin-left:8px}
.modal-tabs{display:flex;gap:4px;margin:12px 0;border-bottom:1px solid var(--border);padding-bottom:0;flex-wrap:wrap}
.modal-tab{padding:6px 12px;font-size:12px;cursor:pointer;border-radius:4px 4px 0 0;color:var(--text2);border:1px solid transparent;border-bottom:none;transition:all .1s}
.modal-tab:hover{background:var(--bg);color:var(--text)}
.modal-tab.active{background:var(--bg);color:var(--accent2);font-weight:600;border-color:var(--border)}
.modal-section{display:none;padding:12px 0}
.modal-section.active{display:block}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.modal-box{background:var(--bg);border-radius:8px;padding:14px}
.modal-box h4{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);margin-bottom:8px}
.modal-box .row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px}
.modal-box .row .val{font-family:var(--font-mono);font-size:12px}
.modal-full{grid-column:1/-1}
.deep-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.deep-item{padding:8px 10px;background:var(--bg2);border-radius:6px;border:1px solid var(--border)}
.deep-item .author{font-weight:600;font-size:12px;color:var(--accent2);margin-bottom:3px}
.deep-item p{font-size:12px;color:var(--text2);line-height:1.4}
.search-bar{margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap}
.search-bar input{flex:1;min-width:180px;padding:8px 12px;border:1px solid var(--border);border-radius:6px;background:var(--bg2);color:var(--text);font-size:13px;outline:none}
.search-bar input:focus{border-color:var(--accent2)}
.search-bar select{padding:8px 12px;border:1px solid var(--border);border-radius:6px;background:var(--bg2);color:var(--text);font-size:13px;outline:none}
.menu-toggle{display:none;background:none;border:none;color:var(--text);font-size:20px;cursor:pointer;padding:4px}
.clickable{cursor:pointer}
.clickable:hover td{background:rgba(45,106,79,.08)!important}
th.srt{cursor:pointer;user-select:none}
th.srt:hover{color:var(--accent2)}
th.srt::after{content:' \25B4\25BE';font-size:9px;opacity:.3}
th.srt.asc::after{content:' \25B4';opacity:1;color:var(--accent2)}
th.srt.desc::after{content:' \25BE';opacity:1;color:var(--accent2)}
.chip{display:inline-block;padding:2px 6px;border-radius:3px;font-size:10px;font-weight:600;margin:1px}
.chip-risk{background:rgba(220,38,38,.12);color:var(--loss)}
.chip-cat{background:rgba(22,163,74,.12);color:var(--gain)}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .menu-toggle{display:block}
  .modal-grid{grid-template-columns:1fr}
  .deep-grid{grid-template-columns:1fr}
}
.sub-section{margin-top:20px}
.sub-section .sub-title{font-size:16px;font-weight:600;margin-bottom:8px}
</style>
</head>
<body>

<nav class="sidebar" id="sidebar">
<div class="sidebar-brand">&#9670; AI <span>Berkshire</span></div>
<ul class="nav-list" id="navList"></ul>
</nav>

<div class="main">
<div class="header">
<button class="menu-toggle" id="menuToggle">&#9776;</button>
<h1 id="pageTitle">Dashboard</h1>
<div class="header-actions">
<button class="theme-toggle" id="themeToggle">&#9790; <span id="themeLabel">Dark</span></button>
</div>
</div>
<div class="content" id="content">
<div id="tab-portfolio" class="tab active"></div>
<div id="tab-thesis-tracker" class="tab"></div>
<div id="tab-thesis-drift" class="tab"></div>
<div id="tab-news-pulse" class="tab"></div>
<div id="tab-quality-screen" class="tab"></div>
<div id="tab-bottleneck" class="tab"></div>
<div id="tab-checklist" class="tab"></div>
<div id="tab-research" class="tab"></div>
<div id="tab-buy-sell" class="tab"></div>
<div id="tab-opportunities" class="tab"></div>
<div id="tab-forecast" class="tab"></div>
<div id="tab-action-plan" class="tab"></div>
</div>
</div>

<div class="modal-overlay" id="modalOverlay">
<div class="modal" id="modalContent"></div>
</div>

<script>
const NAV_ITEMS = [
  {id:'portfolio',label:'Portfolio Review',ico:'📊'},
  {id:'thesis-tracker',label:'Thesis Tracker',ico:'📝'},
  {id:'thesis-drift',label:'Thesis Drift',ico:'📈'},
  {id:'news-pulse',label:'News Pulse',ico:'📰'},
  {id:'quality-screen',label:'Quality Screen',ico:'✨'},
  {id:'bottleneck',label:'Bottleneck Hunter',ico:'🔗'},
  {id:'checklist',label:'Investment Checklist',ico:'✅'},
  {id:'research',label:'Investment Research',ico:'🔍'},
  {id:'buy-sell',label:'Buy / Sell Suggestions',ico:'💰'},
  {id:'opportunities',label:'New Buy Opportunities',ico:'💫'},
  {id:'forecast',label:'Forecast',ico:'🔮'},
  {id:'action-plan',label:'Action Plan',ico:'🎯'}
];

const TODAY = '2026-07-21';
const fmt = (n,d=2) => n!=null&&isFinite(n)?n.toFixed(d):'-';
const pnl = (cur,avg,qty) => qty>0?((cur-avg)*qty):0;
const pnlPct = (cur,avg) => avg>0?((cur-avg)/avg*100):0;
const recBadge = r => {
  const m = {'Strong Buy':'sb','Buy':'b','Hold':'h','Sell':'s','Accumulate':'sb','Reduce':'s'};
  const c = m[r]||'h';
  return '<span class="badge badge-'+c+'">'+r+'</span>';
};

// ============ DATA ============

const HOLDINGS = [
  {sym:'BLS',qty:38,avgCost:263.79,ltp:235.1}
];

const BONDS = [
  {sym:'1075SFL28A',qty:3,ltp:9932,desc:'SFL 10.75% 28'},
  {sym:'1125SSFL28',qty:3,ltp:9940,desc:'SSFL 11.25% 28'},
  {sym:'1135AFSL28',qty:3,ltp:10240,desc:'AFSL 11.35% 28'},
  {sym:'11UFL28',qty:3,ltp:8640,desc:'UFL 11% 28'},
  {sym:'1225IFL28-N0',qty:3,ltp:7450,desc:'IFL 12.25% 28'},
  {sym:'1280ACAP28',qty:3,ltp:9941,desc:'ACAP 12.80% 28'},
  {sym:'12KFL27',qty:3,ltp:9892,desc:'KFL 12% 27'}
];

const POSITIONS = [
  {sym:'BLS',qty:10,avgCost:237.09,ltp:235.15}
];

const UNIVERSE = {
  BLS:{pe:14.1,pb:3.95,roe:32.7,de:0.09,div:0.85,mcap:9707,fv:340,rec:'Strong Buy',risk:['Govt contract dependency','Visa policy risk'],cat:['UIDAI ₹2KCr deal','AI visa processing'],score:82,infoLvl:'A'}
};

const DEEP = {
  BLS:{busModel:'Visa & passport outsourcing to 30+ governments',moat:'Government empanelment creates natural barrier; scale-driven cost advantage',mgmt:'Promoter-led; strong execution track record; consistent dividend',finStrength:'Net cash; negative working capital; 32.7% ROE; FCF yield 7.7%',dyp:'Simple recurring-revenue model; likes scalability',buffet:'Service franchise with long-term government contracts; defensible moat',munger:'Easy to understand; watch single-bid renewal risk',lilu:'Monitor govt contract renewals; moat is narrow but real',thesisStatus:'Active',moatAssessment:'Narrow',checklist:'6/8 pass',qualityScore:82,news:'Jul 17: Won \u20b92,055Cr UIDAI Aadhaar contract; Sypha AI partnership',forecast:'Bull 420 / Base 340 / Bear 220',action:'Accumulate on dips <230'},
};

// ============ PORTFOLIO ============
function renderPortfolio(){
  const h = HOLDINGS.filter(x=>x.qty>0);
  const totalCost = h.reduce((s,x)=>s+x.qty*x.avgCost,0);
  const totalVal = h.reduce((s,x)=>s+x.qty*x.ltp,0);
  const totalPnl = totalVal - totalCost;
  const dayChange = h.reduce((s,x)=>s+pnl(x.ltp,x.avgCost,x.qty),0);
  const bondVal = BONDS.reduce((s,x)=>s+x.qty*x.ltp,0);
  const posVal = POSITIONS.reduce((s,x)=>s+x.qty*x.ltp,0);

  document.getElementById('tab-portfolio').innerHTML = `
    <div class="tab-title">Portfolio Review</div>
    <div class="tab-desc">Data as of ${TODAY} — Run: portfolio-review skill</div>
    <div class="stats-row">
      <div class="stat-card"><div class="label">Total Invested</div><div class="value">\u20b9${fmt(totalCost,0)}</div></div>
      <div class="stat-card"><div class="label">Market Value (Eq)</div><div class="value">\u20b9${fmt(totalVal,0)}</div></div>
      <div class="stat-card"><div class="label">Bond Value</div><div class="value">\u20b9${fmt(bondVal,0)}</div></div>
      <div class="stat-card"><div class="label">Positions Value</div><div class="value">\u20b9${fmt(posVal,0)}</div></div>
      <div class="stat-card"><div class="label">Unrealised P&L</div><div class="value ${totalPnl>=0?'gain':'loss'}">${totalPnl>=0?'+':''}\u20b9${fmt(totalPnl,0)}</div><div class="sub">${fmt(totalPnl/totalCost*100,1)}%</div></div>
      <div class="stat-card"><div class="label">Holdings</div><div class="value">${h.length}</div><div class="sub">+ ${BONDS.length} bonds + ${POSITIONS.length} pos</div></div>
    </div>
    <table><thead><tr>
      <th>Stock</th><th>Qty</th><th>Avg Cost</th><th>LTP</th><th>Invested</th><th>Current</th><th>P&L</th><th>Return</th><th>Port%</th><th>Rec</th>
    </tr></thead><tbody>
      ${h.map(x=>{
        const p=pnl(x.ltp,x.avgCost,x.qty);
        const pp=pnlPct(x.ltp,x.avgCost);
        const portPct = totalVal>0 ? (x.qty*x.ltp/totalVal*100) : 0;
        const u=UNIVERSE[x.sym];
        return '<tr class="clickable" onclick="showStock(\''+x.sym+'\')">'+
          '<td><strong>'+(x.disp||x.sym)+'</strong></td>'+
          '<td class="num">'+x.qty+'</td>'+
          '<td class="num">'+fmt(x.avgCost)+'</td>'+
          '<td class="num">'+fmt(x.ltp)+'</td>'+
          '<td class="num">'+fmt(x.qty*x.avgCost,0)+'</td>'+
          '<td class="num">'+fmt(x.qty*x.ltp,0)+'</td>'+
          '<td class="num '+(p>=0?'gain':'loss')+'">'+(p>=0?'+':'')+fmt(p,0)+'</td>'+
          '<td class="num '+(pp>=0?'gain':'loss')+'">'+(pp>=0?'+':'')+fmt(pp,1)+'%</td>'+
          '<td class="num">'+fmt(portPct,1)+'%</td>'+
          '<td>'+(u?recBadge(u.rec):'')+'</td>'+
        '</tr>';
      }).join('')}
    </tbody></table>

    <div class="sub-section">
      <div class="sub-title">Bond Holdings</div>
      <table><thead><tr><th>Bond</th><th>Qty</th><th>LTP</th><th>Value</th></tr></thead><tbody>
        ${BONDS.map(x=>'<tr><td><strong>'+x.desc+'</strong><br><span style="font-size:11px;color:var(--text2)">'+x.sym+'</span></td>'+
          '<td class="num">'+x.qty+'</td><td class="num">'+fmt(x.ltp,0)+'</td>'+
          '<td class="num">'+fmt(x.qty*x.ltp,0)+'</td></tr>').join('')}
        <tr style="font-weight:600"><td>Total Bonds</td><td></td><td></td><td class="num">${fmt(bondVal,0)}</td></tr>
      </tbody></table>
    </div>

    <div class="sub-section">
      <div class="sub-title">Positions (Watchlist)</div>
      <table><thead><tr><th>Stock</th><th>Qty</th><th>Avg Cost</th><th>LTP</th><th>Invested</th><th>Current</th><th>P&L</th><th>Return</th></tr></thead><tbody>
        ${POSITIONS.map(x=>{
          const p=pnl(x.ltp,x.avgCost,x.qty);
          const pp=pnlPct(x.ltp,x.avgCost);
          return '<tr class="clickable" onclick="showStock(\''+x.sym+'\')">'+
            '<td><strong>'+(x.disp||x.sym)+'</strong></td>'+
            '<td class="num">'+x.qty+'</td>'+
            '<td class="num">'+fmt(x.avgCost)+'</td>'+
            '<td class="num">'+fmt(x.ltp)+'</td>'+
            '<td class="num">'+fmt(x.qty*x.avgCost,0)+'</td>'+
            '<td class="num">'+fmt(x.qty*x.ltp,0)+'</td>'+
            '<td class="num '+(p>=0?'gain':'loss')+'">'+(p>=0?'+':'')+fmt(p,0)+'</td>'+
            '<td class="num '+(pp>=0?'gain':'loss')+'">'+(pp>=0?'+':'')+fmt(pp,1)+'%</td>'+
          '</tr>';
        }).join('')}
      </tbody></table>
    </div>

    <div class="sub-section">
      <div class="sub-title">Portfolio Health Assessment</div>
      <table><thead><tr><th>Metric</th><th>Current</th><th>Ideal</th><th>Status</th></tr></thead><tbody>
        <tr><td>Largest holding %</td><td class="num">${fmt(Math.max(...h.map(x=>x.qty*x.ltp/totalVal*100)),1)}%</td><td class="num"><40%</td><td>\u2705</td></tr>
        <tr><td>Top 3 holdings %</td><td class="num">${fmt(h.sort((a,b)=>b.qty*b.ltp-a.qty*a.ltp).slice(0,3).reduce((s,x)=>s+x.qty*x.ltp/totalVal*100,0),1)}%</td><td class="num">50-80%</td><td>\u2705</td></tr>
        <tr><td>Total equity holdings</td><td class="num">${h.length}</td><td class="num">5-15</td><td>\u2705</td></tr>
        <tr><td>Bonds allocation</td><td class="num">${fmt(bondVal/(bondVal+totalVal)*100,1)}%</td><td class="num">10-30%</td><td>\u2705</td></tr>
        <tr><td>Overall health</td><td colspan="2" style="font-weight:600;color:var(--gain)">GOOD \u2014 Well diversified across 13 stocks + 7 bonds</td><td></td></tr>
      </tbody></table>
    </div>
  `;
}

// ============ THESIS TRACKER ============
function renderThesisTracker(){
  const tracked = Object.keys(DEEP);
  document.getElementById('tab-thesis-tracker').innerHTML = `
    <div class="tab-title">Thesis Tracker</div>
    <div class="tab-desc">Investment thesis status — Run: thesis-tracker skill</div>
    <table><thead><tr>
      <th>Stock</th><th>Business Model</th><th>Moat</th><th>Management</th><th>Financial Strength</th><th>Thesis</th><th>Moat</th>
    </tr></thead><tbody>
      ${tracked.map(sym=>{
        const d=DEEP[sym]; if(!d) return '';
        const thesisCls = d.thesisStatus==='Active'?'badge-sb':d.thesisStatus==='Watch'?'badge-h':'badge-s';
        return '<tr class="clickable" onclick="showStock(\''+sym+'\')">'+
          '<td><strong>'+(sym==='M_M'?'M&M':sym)+'</strong></td>'+
          '<td style="max-width:160px;font-size:12px">'+d.busModel+'</td>'+
          '<td style="font-size:12px;max-width:140px">'+d.moat+'</td>'+
          '<td style="font-size:12px;max-width:140px">'+d.mgmt+'</td>'+
          '<td style="font-size:12px;max-width:140px">'+d.finStrength+'</td>'+
          '<td><span class="badge '+thesisCls+'">'+d.thesisStatus+'</span></td>'+
          '<td><div style="display:flex;align-items:center;gap:6px"><span style="font-size:11px;color:var(--text2)">'+d.moatAssessment+'</span></div></td>'+
        '</tr>';
      }).filter(Boolean).join('')}
    </tbody></table>

      '<div style="margin-top:8px"><h4>Moat Assessment</h4>'+
      '<span style="font-size:12px">'+(d.moat||'N/A')+'</span></div>'+
    '</div>';
    html += '<div class="modal-box"><h4>Management & Financial</h4>'+

  if(u.fv){
    const upside = price>0?((parseFloat(u.fv)/price-1)*100):0;

      '<div class="row"><span>Fair Value</span><span class="val gain">\u20b9'+fmt(u.fv,0)+'</span></div>'+
      '<div class="row"><span>Upside</span><span class="val gain">+'+(upside>0?fmt(upside,1):'0.0')+'%</span></div>'+

  html += '</div></div>';

  // TAB 2: Four Masters
  html += '<div id="mt-masters-'+sym+'" class="modal-section">';
  if(d){
    html += '<div class="deep-grid">'+
      '<div class="deep-item"><div class="author">Duan Yongping</div><p>'+(d.dyp||'N/A')+'</p></div>'+
      '<div class="deep-item"><div class="author">Warren Buffett</div><p>'+(d.buffet||'N/A')+'</p></div>'+
      '<div class="deep-item"><div class="author">Charlie Munger</div><p>'+(d.munger||'N/A')+'</p></div>'+
      '<div class="deep-item"><div class="author">Li Lu</div><p>'+(d.lilu||'N/A')+'</p></div>'+
    '</div>';
  } else {
    html += '<div class="modal-box modal-full" style="text-align:center;padding:20px;color:var(--text2)">'+
      '<div style="font-size:24px;margin-bottom:8px">\ud83d\udccb</div>'+
      '<p>Four Masters analysis not yet generated for '+sym+'.<br>Run <strong>/investment-team</strong> or <strong>/investment-research</strong> to populate.</p>'+
      '<p style="margin-top:8px;font-size:12px">Available financial data: PE '+(u.pe||'?')+'x | ROE '+(u.roe||'?')+'% | Score '+(u.score||'?')+'</p>'+
    '</div>';
  }
  html += '</div>';

  // TAB 3: Financials
  html += '<div id="mt-financials-'+sym+'" class="modal-section">';
  if(u.pe||u.roe){
    const roeLabel = u.roe>=25?'\u2705 Excellent':u.roe>=15?'\u2705 Good':u.roe>=10?'\u26a0\ufe0f Average':'\u274c Poor';
    const peLabel = u.pe&&u.pe<=12?'\u2705 Cheap':u.pe&&u.pe<=20?'\u2705 Fair':u.pe&&u.pe<=30?'\u26a0\ufe0f Premium':'\u274c Expensive';
    html += '<div class="modal-grid">'+
      '<div class="modal-box modal-full"><h4>Quality Screen (7-Factor)</h4>'+
      '<table style="box-shadow:none;margin:0"><thead><tr><th>Factor</th><th>Value</th><th>Score</th></tr></thead><tbody>'+
        '<tr><td>ROE</td><td>'+fmt(u.roe,1)+'%</td><td>'+roeLabel+'</td></tr>'+
        '<tr><td>P/E</td><td>'+fmt(u.pe,1)+'x</td><td>'+peLabel+'</td></tr>'+
        '<tr><td>D/E</td><td>'+(u.de!=null?fmt(u.de,2):'-')+'</td><td>'+(u.de!=null&&u.de<=0.2?'\u2705 Low':u.de!=null&&u.de<=0.5?'\u2705 Manageable':'\u26a0\ufe0f High')+'</td></tr>'+
        '<tr><td>Dividend</td><td>'+fmt(u.div,1)+'%</td><td>'+(u.div>=3?'\u2705 High Yield':u.div>=1?'\u2705 Moderate':'--')+'</td></tr>'+
        '<tr><td>Market Cap</td><td>\u20b9'+fmt(u.mcap,0)+'Cr</td><td>'+(u.mcap>100000?'\u2705 Large Cap':u.mcap>10000?'\u2705 Mid Cap':'\u26a0\ufe0f Small Cap')+'</td></tr>'+
      '</tbody></table>'+
      '</div>';
    if(d){
      html += '<div class="modal-box"><h4>Bottleneck Hunter</h4>'+
        '<p style="font-size:12px">Moat: '+(d.moat||'Not analyzed')+'</p>'+
        '<p style="font-size:12px;margin-top:4px">Score: <strong>'+(u.score||'?')+'</strong></p>'+
      '</div>'+
      '<div class="modal-box"><h4>Forecast Summary</h4>'+
        '<p style="font-size:12px">Bull '+(d.bull||'?')+', Base '+(d.base||'?')+', Bear '+(d.bear||'?')+'</p>'+
      '</div>';
    }
    html += '</div>';
  } else {
    html += '<div class="modal-box modal-full" style="text-align:center;padding:20px;color:var(--text2)">'+
      '<p>'+sym+' is a bond instrument. No equity financial metrics to display.</p>'+
      '<p style="font-size:12px;margin-top:4px">Bond Value: \u20b9'+fmt(h?h.qty*h.ltp:'',0)+'</p>'+
    '</div>';
  }
  html += '</div>';

  // TAB 4: Risk & Catalysts
  html += '<div id="mt-risk-'+sym+'" class="modal-section"><div class="modal-grid">'+
    '<div class="modal-box"><h4>Risks</h4>'+
      (u.risk?u.risk.map(r=>'<span class="chip chip-risk">'+r+'</span>').join(' '):'<span style="font-size:12px;color:var(--text2)">Not identified</span>')+
    '</div>'+
    '<div class="modal-box"><h4>Catalysts</h4>'+
      (u.cat?u.cat.map(c=>'<span class="chip chip-cat">'+c+'</span>').join(' '):'<span style="font-size:12px;color:var(--text2)">Not identified</span>')+
    '</div>'+
  '</div></div>';

  // TAB 5: Skill Reports
  const deep = DEEP[sym];
  html += '<div id="mt-skills-'+sym+'" class="modal-section"><div class="modal-grid">'+
    '<div class="modal-box"><h4>Portfolio Review</h4>'+
      (h?'<div class="row"><span>Qty</span><span class="val">'+h.qty+'</span></div>'+
      '<div class="row"><span>Avg Cost</span><span class="val">\u20b9'+fmt(h.avgCost)+'</span></div>'+
      '<div class="row"><span>P&L</span><span class="val '+(pnl(h.ltp,h.avgCost,h.qty)>=0?'gain':'loss')+'">'+fmt(pnl(h.ltp,h.avgCost,h.qty),0)+'</span></div>'+
      '<div class="row"><span>Weight</span><span class="val">'+fmt((h.qty*h.ltp/(HOLDINGS.reduce((s,x)=>s+x.qty*x.ltp,0)||1))*100,1)+'%</span></div>':
      '<span style="font-size:12px;color:var(--text2)">Not in portfolio</span>')+
    '</div>'+
    '<div class="modal-box"><h4>Thesis Tracker</h4>'+
      (deep?'<span class="badge '+(deep.thesisStatus==='Active'?'badge-sb':deep.thesisStatus==='Watch'?'badge-h':'badge-s')+'">'+(deep.thesisStatus||'N/A')+'</span>'+
      '<div style="margin-top:6px"><span style="font-size:12px">Moat: '+(deep.moatAssessment||'N/A')+'</span></div>':
      '<span style="font-size:12px;color:var(--text2)">No thesis tracked</span>')+
    '</div>'+
    '<div class="modal-box"><h4>Thesis Drift</h4>'+
      '<span style="font-size:12px">'+(deep?'Status: '+(deep.thesisStatus||'Unknown'):'Baseline not established')+'</span>'+
      '<div style="margin-top:4px"><span style="font-size:12px;color:var(--text2)">Compare with original thesis via /thesis-drift</span></div>'+
    '</div>'+
    '<div class="modal-box"><h4>News Pulse</h4>'+
      '<span style="font-size:12px">'+(deep?deep.news||'No recent news':'No news tracked')+'</span>'+
    '</div>'+
    '<div class="modal-box"><h4>Quality Screen</h4>'+
      '<span style="font-size:12px">Score: <strong>'+(u.score||'-')+'</strong>/80 | Recommendation: '+recBadge(u.rec)+'</span>'+
      '<div style="margin-top:4px"><span style="font-size:12px;color:var(--text2)">ROE: '+fmt(u.roe,1)+'% | PE: '+(u.pe?fmt(u.pe,1)+'x':'-')+'</span></div>'+
    '</div>'+
    '<div class="modal-box"><h4>Bottleneck Hunter</h4>'+
      '<span style="font-size:12px">'+(d?d.moat:'Supply chain position not analyzed')+'</span>'+
    '</div>'+
    '<div class="modal-box"><h4>Investment Checklist</h4>'+
      '<span style="font-size:12px">'+(deep?'Passes: '+(deep.checklist||'Checklist not run'):'Run /investment-checklist to evaluate')+'</span>'+
    '</div>'+
    '<div class="modal-box"><h4>Investment Research</h4>'+
      '<span style="font-size:12px">'+(u.infoLvl?'Info level: '+u.infoLvl+' \u2014 '+(u.infoLvl==='A'?'Rich data, well covered':u.infoLvl==='B'?'Moderate data, some estimation':'Limited data, high uncertainty'):'Not yet researched')+'</span>'+
    '</div>'+
  '</div></div>';

  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('open');
}

function switchModalTab(el, tabId, sym){
  document.querySelectorAll('#modalContent .modal-tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('#modalContent .modal-section').forEach(s=>s.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('mt-'+tabId+'-'+sym).classList.add('active');
}

function closeModal(){
  document.getElementById('modalOverlay').classList.remove('open');
}
document.getElementById('modalOverlay').addEventListener('click',function(e){
  if(e.target===this) closeModal();
});

// ============ NAVIGATION ============
function switchTab(id){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  document.querySelector('.nav-item[data-tab="'+id+'"]').classList.add('active');
  const item = NAV_ITEMS.find(x=>x.id===id);
  document.getElementById('pageTitle').textContent = item ? item.label : id;
  if(window.innerWidth<=768) document.getElementById('sidebar').classList.remove('open');
}

function toggleTheme(){
  const d = document.documentElement.getAttribute('data-theme');
  const next = d==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  document.getElementById('themeLabel').textContent = next==='dark'?'Dark':'Light';
  localStorage.setItem('theme',next);
}
let sortDir = {};
function makeSortable(){
  document.querySelectorAll('.content table').forEach(tbl=>{
    tbl.querySelectorAll('th').forEach(th=>{
      th.classList.add('srt');
      th.removeAttribute('onclick');
    });
  });
}
document.addEventListener('click',e=>{
  const th = e.target.closest('th.srt');
  if(!th) return;
  const t = th.closest('table');
  if(!t) return;
  const h = Array.from(t.querySelectorAll('th'));
  const col = h.indexOf(th);
  const key = t.id||'t'+Array.from(t.parentNode.children).indexOf(t);
  const tbody = t.querySelector('tbody');
  if(!tbody) return;
  const rows = Array.from(tbody.querySelectorAll('tr'));
  const dir = sortDir[key+'_'+col]==='asc'?'desc':'asc';
  sortDir[key+'_'+col] = dir;
  h.forEach((x,i)=>{
    x.classList.toggle('asc',i===col&&dir==='asc');
    x.classList.toggle('desc',i===col&&dir==='desc');
  });
  rows.sort((a,b)=>{
    let va = a.children[col]?.textContent.trim().replace(/[₹,+\-%\s]/g,'')||'';
    let vb = b.children[col]?.textContent.trim().replace(/[₹,+\-%\s]/g,'')||'';
    const na = parseFloat(va), nb = parseFloat(vb);
    if(!isNaN(na)&&!isNaN(nb)) return dir==='asc'?na-nb:nb-na;
    return dir==='asc'?va.localeCompare(vb):vb.localeCompare(va);
  });
  rows.forEach(r=>tbody.appendChild(r));
});

function filterTable(inputId,tableId){
  const q = document.getElementById(inputId).value.toLowerCase();
  const selId = inputId.replace('Search','Filter');
  const sel = document.getElementById(selId);
  const filterVal = sel?sel.value:'';
  const rows = document.getElementById(tableId).querySelectorAll('tbody tr');
  rows.forEach(r=>{
    const txt = r.textContent.toLowerCase();
    const match = txt.includes(q);
    const recMatch = !filterVal || txt.includes(filterVal.toLowerCase());
    r.style.display = match&&recMatch?'':'none';
  });
}

// ============ INIT ============
function init(){
  const nav = document.getElementById('navList');
  NAV_ITEMS.forEach((x,i)=>{
    const li = document.createElement('li');
    li.className = 'nav-item'+(i===0?' active':'');
    li.setAttribute('data-tab',x.id);
    li.innerHTML = '<span class="ico">'+x.ico+'</span> '+x.label;
    li.addEventListener('click',()=>switchTab(x.id));
    nav.appendChild(li);
  });

  const saved = localStorage.getItem('theme');
  if(saved){document.documentElement.setAttribute('data-theme',saved);document.getElementById('themeLabel').textContent=saved==='dark'?'Dark':'Light';}

  document.getElementById('themeToggle').addEventListener('click',toggleTheme);
  document.getElementById('menuToggle').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));

  renderPortfolio();
  renderThesisTracker();
  renderThesisDrift();
  renderNewsPulse();
  renderQualityScreen();
  renderBottleneck();
  renderChecklist();
  renderResearch();
  renderBuySell();
  renderOpportunities();
  renderForecast();
  renderActionPlan();
  makeSortable();
}

document.addEventListener('DOMContentLoaded',init);
</script>
