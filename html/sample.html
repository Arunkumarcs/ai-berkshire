function renderQualityScreen(){
  const stocks = Object.keys(UNIVERSE).map(sym=>{
    const u=UNIVERSE[sym];
    const roeScore = u.roe>=25?20:u.roe>=18?15:u.roe>=12?10:5;
    const deScore = u.de==null?15:u.de<=0.2?15:u.de<=0.5?10:5;
    const divScore = u.div>=3?10:u.div>=1.5?7:u.div>=0.5?4:0;
    const peScore = u.pe&&u.pe<=12?20:u.pe&&u.pe<=20?15:u.pe&&u.pe<=30?10:5;
    const recScore = u.rec==='Strong Buy'?15:u.rec==='Buy'?10:u.rec==='Hold'?5:0;
    const total = Math.min(roeScore+deScore+divScore+(peScore||0)+recScore,80);
    return {...u,sym,score:total};
  }).sort((a,b)=>b.score-a.score);

  document.getElementById('tab-quality-screen').innerHTML = `
    <div class="tab-title">Quality Screen — 7-Factor Analysis</div>
    <div class="tab-desc">Run: quality-screen skill. ROE≥15, FCF+ve, D/E<0.5, Margin≥15%, OCF/NI>0.7, Net margin≥5%, Dilution<20%</div>
    <div class="search-bar">

      <div class="modal-box"><h4>Quality Screen</h4>
        <span style="font-size:12px">Score: <strong>${u.score||'-'}/80</strong> | Recommendation: ${recBadge(u.rec)}</span>
        <div style="margin-top:4px"><span style="font-size:12px;color:var(--text2)">ROE: ${fmt(u.roe,1)}% | PE: ${u.pe?fmt(u.pe,1)+'x':'-'}</span></div>
      </div>
      <div class="modal-box"><h4>Bottleneck Hunter</h4>
        <span style="font-size:12px">${d?d.moat:'Supply chain position not analyzed'}</span>
      </div>
      <div class="modal-box"><h4>Investment Checklist</h4>
        <span style="font-size:12px">${d?`Passes: ${d.checklist||'Checklist not run'}`:'Run /investment-checklist to evaluate'}</span>
      </div>
      <div class="modal-box"><h4>Investment Research</h4>
        <span style="font-size:12px">${u.infoLvl?`Info level: ${u.infoLvl} — ${u.infoLvl==='A'?'Rich data, well covered':u.infoLvl==='B'?'Moderate data, some estimation':'Limited data, high uncertainty'}`:'Not yet researched'}</span>
      </div>
    </div>
  </div>`;

  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('open');
}

function switchModalTab(el, tabId, sym){
  document.querySelectorAll('#modalContent .modal-tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('#modalContent .modal-section').forEach(s=>s.classList.remove('active'));
  el.classList.add('active');
  document.getElementById(`mt-${tabId}-${sym}`).classList.add('active');
}

function closeModal(){
  document.getElementById('modalOverlay').classList.remove('open');
}
document.getElementById('modalOverlay').addEventListener('click',function(e){
  if(e.target===this) closeModal();
});

// ============ NAVIGATION ============
function switchTab(id){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  document.querySelector(`.nav-item[data-tab="${id}"]`).classList.add('active');
  const item = NAV_ITEMS.find(x=>x.id===id);
  document.getElementById('pageTitle').textContent = item ? item.label : id;
  if(window.innerWidth<=768) document.getElementById('sidebar').classList.remove('open');
}

function toggleTheme(){
  const d = document.documentElement.getAttribute('data-theme');
  const next = d==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  document.getElementById('themeLabel').textContent = next==='dark'?'Dark':'Light';
  localStorage.setItem('theme',next);
}

function filterTable(inputId,tableId){
  const q = document.getElementById(inputId).value.toLowerCase();
  const sel = document.getElementById(inputId.replace('Search','Filter'));
  const filterVal = sel?sel.value:'';
  const rows = document.getElementById(tableId).querySelectorAll('tbody tr');
  rows.forEach(r=>{
    const txt = r.textContent.toLowerCase();
    const match = txt.includes(q);
    const recMatch = !filterVal || txt.includes(filterVal.toLowerCase());
    r.style.display = match&&recMatch?'':'none';
  });
}

// ============ INIT ============
function init(){
  const nav = document.getElementById('navList');
  NAV_ITEMS.forEach((x,i)=>{
    const li = document.createElement('li');
    li.className = 'nav-item'+(i===0?' active':'');
    li.setAttribute('data-tab',x.id);
    li.innerHTML = `<span class="ico">${x.ico}</span> ${x.label}`;
    li.addEventListener('click',()=>switchTab(x.id));
    nav.appendChild(li);
  });

  const saved = localStorage.getItem('theme');
  if(saved){document.documentElement.setAttribute('data-theme',saved);document.getElementById('themeLabel').textContent=saved==='dark'?'Dark':'Light';}

  document.getElementById('themeToggle').addEventListener('click',toggleTheme);
  document.getElementById('menuToggle').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));

  renderPortfolio();
  renderThesisTracker();
  renderThesisDrift();
  renderNewsPulse();
  renderQualityScreen();
  renderBottleneck();
  renderChecklist();
  renderResearch();
  renderBuySell();
  renderOpportunities();
  renderForecast();
  renderActionPlan();
}

document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
