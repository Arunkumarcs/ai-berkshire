[data-theme=dark] {
  --bg: #0f1117; --bg2: #1a1d2e; --sidebar: #0b0d14; --sidebar-hover: #1a1d2e;

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;min-height:100vh;overflow-x:hidden}
a{color:var(--accent2);text-decoration:none}
.sidebar{width:var(--nav-width);background:var(--sidebar);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;overflow-y:auto;transition:transform .2s}
.sidebar-brand{padding:16px 18px;font-size:15px;font-weight:700;color:#fff;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:8px}
.sidebar-brand span{color:var(--accent2)}
.nav-list{list-style:none;padding:8px 0}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 18px;color:rgba(255,255,255,.55);cursor:pointer;font-size:13px;font-weight:500;transition:all .15s;border-left:3px solid transparent}
.nav-item:hover{color:#fff;background:var(--sidebar-hover)}
.nav-item.active{color:#fff;background:var(--sidebar-active);border-left-color:var(--accent2);font-weight:600}
.nav-item .ico{width:18px;text-align:center;font-size:14px}
.main{flex:1;margin-left:var(--nav-width);min-height:100vh;display:flex;flex-direction:column}
.header{display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--border);background:var(--bg2);position:sticky;top:0;z-index:50;height:52px}
.header h1{font-size:16px;font-weight:600}
.header-actions{display:flex;align-items:center;gap:12px}
.theme-toggle{background:none;border:1px solid var(--border);border-radius:6px;padding:6px 10px;cursor:pointer;color:var(--text);font-size:13px;display:flex;align-items:center;gap:4px}
.theme-toggle:hover{background:var(--border)}
.content{padding:20px 24px;flex:1}
.tab{display:none}
.tab.active{display:block}
.tab-title{font-size:20px;font-weight:700;margin-bottom:4px}
.tab-desc{color:var(--text2);margin-bottom:16px;font-size:13px}
.stats-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:14px 18px;flex:1;min-width:140px;box-shadow:var(--card-shadow)}
.stat-card .label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);margin-bottom:4px}
.stat-card .value{font-size:20px;font-weight:700}
.stat-card .sub{font-size:11px;color:var(--text2);margin-top:2px}
.stat-card .value.gain{color:var(--gain)}
.stat-card .value.loss{color:var(--loss)}
table{width:100%;border-collapse:collapse;background:var(--bg2);border-radius:8px;overflow:hidden;box-shadow:var(--card-shadow);margin-bottom:16px}
th{text-align:left;padding:10px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);background:var(--bg);border-bottom:1px solid var(--border);font-weight:600}
td{padding:9px 12px;font-size:13px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(45,106,79,.04)}
td.num{font-family:var(--font-mono);text-align:right;font-size:12px}
td.num.gain{color:var(--gain)}
td.num.loss{color:var(--loss)}
td.center{text-align:center}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.badge-sb{background:#d1fae5;color:#065f46}
.badge-b{background:#dbeafe;color:#1e40af}
.badge-h{background:#fef3c7;color:#92400e}
.badge-s{background:#fee2e2;color:#991b1b}
[data-theme=dark] .badge-sb{background:#064e3b;color:#6ee7b7}
[data-theme=dark] .badge-b{background:#1e3a5f;color:#93c5fd}
[data-theme=dark] .badge-h{background:#78350f;color:#fcd34d}
[data-theme=dark] .badge-s{background:#7f1d1d;color:#fca5a5}
.badge-p1{background:#fee2e2;color:#991b1b}
.badge-p2{background:#fef3c7;color:#92400e}
.badge-p3{background:#e0e7ff;color:#3730a3}
[data-theme=dark] .badge-p1{background:#7f1d1d;color:#fca5a5}
[data-theme=dark] .badge-p2{background:#78350f;color:#fcd34d}
[data-theme=dark] .badge-p3{background:#312e81;color:#a5b4fc}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:var(--modal-overlay);z-index:999;justify-content:center;align-items:flex-start;padding:40px 20px;overflow-y:auto}
.modal-overlay.open{display:flex}
.modal{background:var(--bg2);border-radius:12px;max-width:900px;width:100%;padding:28px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.3);margin:auto}

.modal-close:hover{background:var(--border);color:var(--text)}

.modal .price-change{font-size:14px;margin-left:8px}

.modal-tab{padding:6px 12px;font-size:12px;cursor:pointer;border-radius:4px 4px 0 0;color:var(--text2);border:1px solid transparent;border-bottom:none;transition:all .1s}
.modal-tab:hover{background:var(--bg);color:var(--text)}
.modal-tab.active{background:var(--bg);color:var(--accent2);font-weight:600;border-color:var(--border)}
.modal-section{display:none;padding:12px 0}

.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.modal-box{background:var(--bg);border-radius:8px;padding:14px}
.modal-box h4{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);margin-bottom:8px}

.modal-box .row .val{font-family:var(--font-mono);font-size:12px}
.modal-full{grid-column:1/-1}
.deep-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}

th.srt:hover{color:var(--accent2)}
th.srt::after{content:' \25B4\25BE';font-size:9px;opacity:.3}
th.srt.asc::after{content:' \25B4';opacity:1;color:var(--accent2)}
th.srt.desc::after{content:' \25BE';opacity:1;color:var(--accent2)}

@media(max-width:768px){

  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .menu-toggle{display:block}
  .modal-grid{grid-template-columns:1fr}
  .deep-grid{grid-template-columns:1fr}

</style>

      ${h.map(x=>{
        const p=pnl(x.ltp,x.avgCost,x.qty);

function renderThesisDrift(){

        const status = drift >= -5 ? '<span class="badge badge-sb">Intact</span>' : drift >= -15 ? '<span class="badge badge-h">Watch</span>' : '<span class="badge badge-s">Weakened</span>';
        const keyChange = u.cats ? u.cats[0] : 'No major change';
        const factOrPrice = Math.abs(drift) < 10 ? 'Price — fundamentals intact' : 'Mixed';

          '<td><strong>'+s+'</strong></td><td>'+status+'</td>'+
          '<td class="num '+(drift>=0?'gain':'loss')+'">'+(drift>=0?'+':'')+fmt(drift,1)+'%</td>'+

}

function renderQualityScreen(){
  const stocks = Object.keys(UNIVERSE).map(sym=>{
    const u=UNIVERSE[sym];
    const roeScore = u.roe>=25?20:u.roe>=18?15:u.roe>=12?10:5;
    const deScore = u.de==null?15:u.de<=0.2?15:u.de<=0.5?10:5;
    const divScore = u.div>=3?10:u.div>=1.5?7:u.div>=0.5?4:0;
    const peScore = u.pe&&u.pe<=12?20:u.pe&&u.pe<=20?15:u.pe&&u.pe<=30?10:5;
    const recScore = u.rec==='Strong Buy'?15:u.rec==='Buy'?10:u.rec==='Hold'?5:0;
    const total = Math.min(roeScore+deScore+divScore+(peScore||0)+recScore,80);
    return {...u,sym,score:total};
  }).sort((a,b)=>b.score-a.score);

  document.getElementById('tab-quality').innerHTML = `
    <div class="tab-title">Quality Screen — 7-Factor Analysis</div>
    <div class="tab-desc">Run: quality-screen skill</div>

      </select>
    </div>
    <table id="qTable"><thead><tr>
      <th>#</th><th>Stock</th><th>PE</th><th>ROE</th><th>D/E</th><th>Div%</th><th>Mkt Cap</th><th>Score</th><th>Rec</th><th>Risk</th>

      ${stocks.map((x,i)=>'<tr class="clickable" onclick="showStock(\''+x.sym+'\')">'+

  document.getElementById('tab-'+id).classList.add('active');
  document.querySelector('.nav-item[data-tab="'+id+'"]').classList.add('active');
  const labels = {portfolio:'Portfolio Review',thesis:'Thesis Tracker',drift:'Thesis Drift',news:'News Pulse',quality:'Quality Screen',bottleneck:'Bottleneck',checklist:'Checklist',research:'Research',valuation:'Valuation',risk:'Risk',bonds:'Bonds',buy:'Buy/Sell',opportunities:'Opportunities',forecast:'Forecast',action:'Action Plan'};
  document.getElementById('pageTitle').textContent = labels[id]||id;
  if(window.innerWidth<=768) document.getElementById('sidebar').classList.remove('open');
}

function toggleTheme(){
  const d = document.documentElement.getAttribute('data-theme');
  const next = d==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  document.getElementById('themeLabel').textContent = next==='dark'?'Dark':'Light';
  localStorage.setItem('theme',next);
}

function makeSortable(){
  document.querySelectorAll('.content table').forEach(tbl=>{
    tbl.querySelectorAll('th').forEach(th=>{th.classList.add('srt');});
  });
}
function filterTable(inputId,tableId){
  const q = document.getElementById(inputId).value.toLowerCase();
  const sel = document.getElementById(inputId.replace('Search','Filter'));
  const filterVal = sel?sel.value:'';
  const rows = document.getElementById(tableId).querySelectorAll('tbody tr');
  rows.forEach(r=>{
    const txt = r.textContent.toLowerCase();
    const recMatch = !filterVal || txt.includes(filterVal.toLowerCase());
    r.style.display = txt.includes(q)&&recMatch?'':'none';
  });
}

// Sorting
let sortDir = {};
document.addEventListener('click',e=>{
  const th = e.target.closest('th.srt');
  if(!th) return;
  const t = th.closest('table');
  if(!t) return;
  const h = Array.from(t.querySelectorAll('th'));
  const col = h.indexOf(th);
  const key = t.id||'t'+Array.from(t.parentNode.children).indexOf(t);
  const tbody = t.querySelector('tbody');
  if(!tbody) return;
  const rows = Array.from(tbody.querySelectorAll('tr'));
  const dir = sortDir[key+'_'+col]==='asc'?'desc':'asc';
  sortDir[key+'_'+col] = dir;
  h.forEach((x,i)=>{
    x.classList.toggle('asc',i===col&&dir==='asc');
    x.classList.toggle('desc',i===col&&dir==='desc');
  });
  rows.sort((a,b)=>{
    let va = a.children[col]?.textContent.trim().replace(/[₹,+\-%\s]/g,'')||'';
    let vb = b.children[col]?.textContent.trim().replace(/[₹,+\-%\s]/g,'')||'';
    const na = parseFloat(va), nb = parseFloat(vb);
    if(!isNaN(na)&&!isNaN(nb)) return dir==='asc'?na-nb:nb-na;
    return dir==='asc'?va.localeCompare(vb):vb.localeCompare(va);
  });
  rows.forEach(r=>tbody.appendChild(r));
});

function init(){
  const nav = document.getElementById('navList');
  const items = [
    {id:'portfolio',label:'Portfolio Review',ico:'📊'},
    {id:'thesis',label:'Thesis Tracker',ico:'📝'},
    {id:'drift',label:'Thesis Drift',ico:'📈'},
    {id:'news',label:'News Pulse',ico:'📰'},
    {id:'quality',label:'Quality Screen',ico:'✨'},
    {id:'bottleneck',label:'Bottleneck',ico:'🔗'},
    {id:'checklist',label:'Checklist',ico:'✅'},
    {id:'research',label:'Research',ico:'🔍'},
    {id:'valuation',label:'Valuation',ico:'💰'},
    {id:'risk',label:'Risk',ico:'⚠️'},
    {id:'bonds',label:'Bonds',ico:'🏦'},
    {id:'buy',label:'Buy/Sell',ico:'💫'},
    {id:'opportunities',label:'Opportunities',ico:'🌟'},
    {id:'forecast',label:'Forecast',ico:'🔮'},
    {id:'action',label:'Action Plan',ico:'🎯'}
  ];
  items.forEach((x,i)=>{
    const li = document.createElement('li');
    li.className = 'nav-item'+(i===0?' active':'');
    li.setAttribute('data-tab',x.id);
    li.innerHTML = '<span class="ico">'+x.ico+'</span> '+x.label;
    li.addEventListener('click',()=>switchTab(x.id));
    nav.appendChild(li);
  });

  const saved = localStorage.getItem('theme');
  if(saved){document.documentElement.setAttribute('data-theme',saved);document.getElementById('themeLabel').textContent=saved==='dark'?'Dark':'Light';}

  document.getElementById('themeToggle').addEventListener('click',toggleTheme);
  document.getElementById('menuToggle').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));

  renderPortfolio();
  renderThesisTracker();
  renderThesisDrift();
  renderNewsPulse();
  renderQualityScreen();
  renderBottleneck();
  renderChecklist();
  renderResearch();
  renderValuation();
  renderRisk();
  renderBonds();
  renderBuySell();
  renderOpportunities();
  renderForecast();
  renderActionPlan();
  setTimeout(makeSortable, 100);
}
document.addEventListener('DOMContentLoaded',init);
</script>
